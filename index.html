<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QyrexObf | Executor Edition v15</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap');
        
        :root {
            --bg-base: #030303;
            --bg-panel: #0d0d12;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.4);
            --danger: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #475569;
            --border: #1f2937;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 2rem; 
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, transparent 50%);
        }
        
        header { 
            text-align: center; 
            margin-bottom: 2rem; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 1rem; 
            width: 100%; 
            max-width: 1500px; 
        }
        
        h1 { 
            color: var(--text-main); 
            font-size: 2.5rem; 
            letter-spacing: 2px; 
            font-weight: 700;
        }
        h1 span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
        
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; text-transform: uppercase; letter-spacing: 3px; }
        
        .workspace { display: flex; gap: 20px; width: 100%; max-width: 1500px; height: 75vh; }
        
        .editor-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .editor-header { 
            background: #09090b; 
            padding: 12px 20px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        
        .status-dot {
            height: 10px; width: 10px; background-color: var(--danger); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--danger);
        }
        .status-dot.ready { background-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
        
        textarea { 
            flex: 1; 
            width: 100%; 
            background-color: transparent; 
            color: #d1d5db; 
            border: none; 
            padding: 20px; 
            font-size: 13px; 
            resize: none; 
            outline: none; 
            line-height: 1.5;
            word-wrap: break-word;
        }
        textarea:focus { color: var(--accent); }
        
        .action-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: 0 20px; min-width: 250px; }
        
        .btn-obfuscate { 
            background: transparent; 
            color: var(--accent); 
            border: 1px solid var(--accent); 
            padding: 15px 40px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1) inset;
        }
        .btn-obfuscate:hover { 
            background: var(--accent); 
            color: #000; 
            box-shadow: 0 0 30px var(--accent-glow); 
            transform: scale(1.05); 
        }
        
        .console-log {
            background: #000; border: 1px solid var(--border); width: 100%; border-radius: 6px; padding: 15px; font-size: 0.75rem; color: var(--text-muted); height: 200px; overflow-y: auto; text-align: left;
        }
        .log-entry { margin-bottom: 5px; }
        .log-success { color: var(--accent); }
        .log-error { color: var(--danger); }
        .log-info { color: #3b82f6; }
    </style>
</head>
<body>

    <header>
        <h1>QYREX<span>OBF</span></h1>
        <div class="subtitle">Executor Edition - LPH-15 Architecture</div>
    </header>

    <div class="workspace">
        <div class="editor-container">
            <div class="editor-header">
                <span>source.lua</span>
                <span class="status-dot ready"></span>
            </div>
            <textarea id="inputCode" spellcheck="false" placeholder='-- Ingresa el script aquí. Compatible con Synapse, Krnl, Fluxus, Delta...
print("Qyrex Domina a los Skidders")'></textarea>
        </div>

        <div class="action-panel">
            <button class="btn-obfuscate" onclick="compilarQyrex()">Ofuscar</button>
            <div class="console-log" id="consoleOutput">
                <div class="log-entry log-info">[+] Qyrex VM Engine Initialized</div>
                <div class="log-entry log-info">[+] Ready to hook environment...</div>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor-header">
                <span>qyrex_protected.lua</span>
                <span class="status-dot" id="outDot"></span>
            </div>
            <textarea id="outputCode" spellcheck="false" readonly placeholder="-- El código encriptado e inyectable aparecerá aquí..."></textarea>
        </div>
    </div>

    <script>
        function logMsg(msg, type = 'info') {
            const consoleEl = document.getElementById('consoleOutput');
            consoleEl.innerHTML += `<div class="log-entry log-${type}">[*] ${msg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // Generador Polimórfico (lIllIIll)
        function genLuraphID(len = Math.floor(Math.random() * 10) + 8) {
            let res = '';
            for(let i=0; i<len; i++) res += Math.random() > 0.5 ? 'l' : 'I';
            return res;
        }

        // Motor de Erradicación Numérica (#"simbolos")
        function obfNum(num) {
            const syms = "!#$%&/()=?¡@+*~_-,;><°|{}[]^"; 
            const genStr = (l) => Array.from({length: l}, () => syms[Math.floor(Math.random() * syms.length)]).join('');
            
            if (num === 0) return `#""`;
            if (num <= 15) return `#"${genStr(num)}"`;
            
            const factor = Math.floor(Math.sqrt(num));
            const remainder = num - (factor * factor);
            
            let expr = `( #"${genStr(factor)}" * #"${genStr(factor)}" )`;
            if (remainder > 0) expr += ` + #"${genStr(remainder)}"`;
            
            return expr;
        }

        function genJunkMath() {
            const v = genLuraphID();
            return `local ${v} = ${obfNum(Math.floor(Math.random() * 500))}; if ${v} == ${obfNum(0)} then error("HAHAHAHHA SKIDDER NOOB") end;`;
        }

        function compilarQyrex() {
            const input = document.getElementById('inputCode').value;
            if (!input.trim()) return logMsg("Error: Código vacío.", "error");

            document.getElementById('consoleOutput').innerHTML = ''; // Limpiar consola
            logMsg("Analizando AST...", "info");
            
            setTimeout(() => {
                logMsg("Aplicando erradicación de números...", "info");
                
                // Variables polimórficas del entorno
                const vState = genLuraphID();
                const vMem = genLuraphID();
                const vKey = genLuraphID();
                const vBuff = genLuraphID();
                const vIdx = genLuraphID();
                
                // Aliases de entorno (Para que no hookeen funciones globales)
                const realLoad = genLuraphID();
                const realChar = genLuraphID();
                const realXor = genLuraphID();
                const realCoCreate = genLuraphID();
                const realCoResume = genLuraphID();

                const xorKey = Math.floor(Math.random() * 200) + 50;

                // Cifrado byte a byte
                let bytecodeMutado = [];
                for (let i = 0; i < input.length; i++) {
                    bytecodeMutado.push(obfNum(input.charCodeAt(i) ^ xorKey));
                }

                logMsg("Generando hilos fantasma (Stack Hiding)...", "info");

                // Generador del CFF con Anti-Tamper para Executors
                let cff = `
-- Protect by QyrexObf [qyrex.hopto.org]

${genJunkMath()}

-- Environment Aliasing (Protección contra hookfunction de Executors)
local ${realLoad} = loadstring
local ${realChar} = string.char
local ${realXor} = bit32.bxor
local ${realCoCreate} = coroutine.create
local ${realCoResume} = coroutine.resume

if type(${realLoad}) ~= "function" or type(${realXor}) ~= "function" then
    error("HAHAHAHHA SKIDDER NOOB")
end

local ${vMem} = {${bytecodeMutado.join(',')}}
local ${vKey} = ${obfNum(xorKey)}
local ${vBuff} = ""
local ${vState} = ${obfNum(1)}

while true do
    if ${vState} == ${obfNum(3)} then
        -- Estado 3: Ejecución en Hilo Fantasma (Anti-Stack Trace)
        local _f, _e = ${realLoad}(${vBuff})
        if not _f then error("HAHAHAHHA SKIDDER NOOB") end
        
        -- Ejecutamos usando coroutine para ocultar el dump en el executor
        local _t = ${realCoCreate}(_f)
        local _s, _r = ${realCoResume}(_t)
        
        if not _s then error("HAHAHAHHA SKIDDER NOOB") end
        break
    elseif ${vState} == ${obfNum(1)} then
        -- Estado 1: Trampas y basura
        ${genJunkMath()}
        ${vState} = ${obfNum(4)}
    elseif ${vState} == ${obfNum(4)} then
        -- Estado 4: Descifrado dinámico
        for ${vIdx} = ${obfNum(1)}, #${vMem} do
            ${vBuff} = ${vBuff} .. ${realChar}(${realXor}(${vMem}[${vIdx}], ${vKey}))
        end
        ${vState} = ${obfNum(2)}
    elseif ${vState} == ${obfNum(2)} then
        -- Estado 2: Verificación de longitud
        if #${vBuff} ~= ${obfNum(input.length)} then error("HAHAHAHHA SKIDDER NOOB") end
        ${vState} = ${obfNum(3)}
    end
end
`;
                
                // Compresión máxima
                let minified = cff.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
                
                // Bombardeo Anti-Decompilador al inicio
                let junkHeader = "-- Protect by QyrexObf [qyrex.hopto.org]\n";
                for(let i=0; i<60; i++) {
                    junkHeader += `local ${genLuraphID()} = ${obfNum(Math.floor(Math.random() * 300))}; `;
                }

                document.getElementById('outputCode').value = junkHeader + "\n" + minified;
                document.getElementById('outDot').classList.add('ready');
                
                logMsg(`[+] Compilación exitosa. Tamaño: ${minified.length} bytes.`, "success");
                logMsg(`[+] Hilo Fantasma inyectado.`, "success");
                logMsg(`[+] Anti-Hooking activado.`, "success");
            }, 500); // Pequeño delay visual para que parezca que procesa intensamente
        }
    </script>
</body>
</html>
