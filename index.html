<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrex Obfuscator | Premium Luau Protection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg: #050505;
            --panel: #0a0a0c;
            --border: #1f1f22;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: white;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span { color: var(--accent); }

        .menu-item {
            padding: 0.75rem 1rem;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 0.5rem;
        }

        .menu-item.active { background: var(--accent); color: white; box-shadow: 0 0 15px var(--accent-glow); }
        .menu-item:hover:not(.active) { background: #1e1e24; color: white; }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 1.5rem;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; font-weight: 600; color: var(--text-dim); }

        .workspace {
            display: flex;
            gap: 1.5rem;
            height: 50vh;
        }

        .editor-container {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .editor-header {
            background: #111114;
            padding: 0.75rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder { color: #334155; }
        #output { color: var(--accent); }

        /* Action Bar & Console */
        .action-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        button:hover { transform: scale(1.02); background: #4f46e5; }
        button:disabled { background: #334155; cursor: not-allowed; box-shadow: none; transform: none; }

        .console {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--success);
            overflow-y: auto;
            max-height: 200px;
        }

        .log-line { margin-bottom: 0.2rem; }
        .log-time { color: var(--text-dim); margin-right: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">QYREX <span>STUDIO</span></div>
        <div class="menu-item active">Obfuscator</div>
        <div class="menu-item">Virtual Machine</div>
        <div class="menu-item">Settings</div>
        <div style="margin-top: auto; font-size: 0.75rem; color: var(--text-dim);">
            Arch: Ikgonavi Engine v3.0<br>
            Target: Luau (Roblox)
        </div>
    </div>

    <div class="main">
        <div class="header">
            <h1>Workspace / main.lua</h1>
            <div style="display: flex; gap: 15px; font-size: 0.85rem;">
                <span>Control Flow: <b style="color:var(--success)">ON</b></span>
                <span>Junk Bloat: <b style="color:var(--success)">MAX</b></span>
            </div>
        </div>

        <div class="workspace">
            <div class="editor-container">
                <div class="editor-header">INPUT (Luau)</div>
                <textarea id="input" spellcheck="false" placeholder="-- Escribe tu script aquí...&#10;print('Qyrex Domina')"></textarea>
            </div>
            
            <div class="editor-container">
                <div class="editor-header">
                    OUTPUT (Obfuscated) 
                    <span style="cursor:pointer; color: white;" onclick="copyCode()">[ Copiar ]</span>
                </div>
                <textarea id="output" readonly spellcheck="false" placeholder="Esperando compilación..."></textarea>
            </div>
        </div>

        <div class="action-bar">
            <button id="btnObf" onclick="startObfuscation()">OBFUSCATE</button>
            <div class="console" id="console">
                <div class="log-line"><span class="log-time">[SYS]</span> Qyrex Engine Ready. Waiting for payload...</div>
            </div>
        </div>
    </div>

    <script>
        const log = (msg, color = "#10b981") => {
            const cons = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            cons.innerHTML += `<div class="log-line" style="color: ${color}"><span class="log-time">[${time}]</span> ${msg}</div>`;
            cons.scrollTop = cons.scrollHeight;
        };

        const generateVar = () => {
            const chars = ['I', 'l'];
            let res = '';
            for(let i = 0; i < Math.floor(Math.random() * 15) + 10; i++) {
                res += chars[Math.floor(Math.random() * chars.length)];
            }
            return res;
        };

        async function startObfuscation() {
            const input = document.getElementById('input').value;
            const outputEl = document.getElementById('output');
            const btn = document.getElementById('btnObf');
            
            if(!input.trim()) return log("Error: Input is empty.", "#ef4444");

            btn.disabled = true;
            outputEl.value = "";
            document.getElementById('console').innerHTML = '';
            
            log("Parsing Syntax Tree...");
            await new Promise(r => setTimeout(r, 600));

            log("Converting ASCII to Qyrex Bytecode...");
            // Convierte el string entero en un array de bytes encriptado
            let byteArray = [];
            for (let i = 0; i < input.length; i++) {
                byteArray.push(input.charCodeAt(i) + 13); // Shift cifrado simple
            }

            await new Promise(r => setTimeout(r, 800));
            log("Generating Opaque Predicates (Junk Bloat ~1MB)...");

            // Generar un script masivo
            let out = `--[[ \n  Qyrex Obfuscator - Premium Build\n  Protected by Ikgonavi Architecture\n]]--\n`;
            
            // Variables maestras
            let envVar = generateVar();
            let tableVar = generateVar();
            let byteVar = generateVar();
            let stringChar = generateVar();
            let concat = generateVar();

            out += `local ${envVar} = getfenv or function() return _ENV end;\n`;
            out += `local ${tableVar} = {};\n`;
            out += `local ${stringChar} = string.char;\n`;
            out += `local ${concat} = table.concat;\n`;

            // INYECTAR BASURA MASIVA PARA PESAR 1MB (Aprox 20,000 líneas de control falso)
            for (let i = 0; i < 20000; i++) {
                let junkVar1 = generateVar();
                let junkVar2 = generateVar();
                let mathOp = Math.random() > 0.5 ? 'math.sin' : 'math.cos';
                out += `local ${junkVar1} = ${mathOp}(${Math.random()}); if ${junkVar1} == ${Math.random()} then ${tableVar}["${junkVar2}"] = nil; end;\n`;
            }

            await new Promise(r => setTimeout(r, 1000));
            log("Applying Control Flow Flattening...");

            // Inyectar el payload cifrado
            out += `local ${byteVar} = {${byteArray.join(',')}};\n`;
            
            // Decodificador y Ejecutor
            let loopVar = generateVar();
            let decodedTable = generateVar();
            let loadstringVar = generateVar();
            
            out += `local ${decodedTable} = {};\n`;
            out += `for ${loopVar} = 1, #${byteVar} do\n`;
            out += `    ${decodedTable}[${loopVar}] = ${stringChar}(${byteVar}[${loopVar}] - 13);\n`;
            out += `end;\n`;

            // Esconder loadstring
            out += `local ${loadstringVar} = ${envVar}()["\\108\\111\\97\\100\\115\\116\\114\\105\\110\\103"];\n`;
            out += `${loadstringVar}(${concat}(${decodedTable}))();\n`;
            
            // Basura final
            for (let i = 0; i < 1000; i++) {
                out += `local ${generateVar()} = ${Math.random()};\n`;
            }

            log("Compilation Successful. Output size expanded.");
            outputEl.value = out;
            btn.disabled = false;
        }

        function copyCode() {
            const out = document.getElementById('output');
            if(!out.value) return;
            out.select();
            document.execCommand('copy');
            log("Code copied to clipboard!", "#3b82f6");
        }
    </script>
</body>
</html>
