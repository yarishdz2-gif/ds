<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikgonavi Obfuscator | Advanced Luau Protection</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #3b82f6;
            --glow: rgba(59, 130, 246, 0.5);
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px var(--glow); }
        .header p { color: var(--text-muted); margin-top: 0.5rem; }
        .container { display: flex; gap: 2rem; width: 100%; max-width: 1200px; height: 60vh; }
        .panel { flex: 1; background: var(--surface); border: 1px solid #27272a; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel-header { background: #27272a; padding: 0.75rem 1rem; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between;}
        textarea { flex: 1; background: transparent; border: none; color: #10b981; padding: 1rem; font-family: 'Courier New', Courier, monospace; resize: none; outline: none; font-size: 14px; }
        textarea::placeholder { color: #3f3f46; }
        .controls { margin-top: 2rem; display: flex; gap: 1rem; }
        button { background: var(--primary); color: white; border: none; padding: 1rem 2.5rem; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 15px var(--glow); text-transform: uppercase; }
        button:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--glow); background: #2563eb; }
        button:active { transform: translateY(0); }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 1rem; border-radius: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ikgonavi Obfuscator</h1>
        <p>Motor de Ofuscación Luau - Nivel 1</p>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-header">INPUT.LUA</div>
            <textarea id="inputCode" placeholder="Pega tu script de Roblox aquí...&#10;ej. print('Hola Mundo')"></textarea>
        </div>
        <div class="panel">
            <div class="panel-header">
                <span>OUTPUT.LUA</span>
                <span style="cursor:pointer; color: #3b82f6;" onclick="copyCode()">Copiar</span>
            </div>
            <textarea id="outputCode" readonly placeholder="El código ofuscado aparecerá aquí..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button onclick="obfuscate()">Ofuscar Script</button>
    </div>

    <div class="toast" id="toast">¡Código copiado al portapapeles!</div>

    <script>
        // Utilidades del Ofuscador
        const generateJunkVar = () => {
            const chars = ['I', 'l'];
            let res = '';
            for(let i=0; i< (Math.floor(Math.random() * 10) + 8); i++) {
                res += chars[Math.floor(Math.random() * chars.length)];
            }
            return res;
        };

        const stringToHex = (str) => {
            return str.split('').map(c => '\\x' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
        };

        const numberToMath = (numStr) => {
            const num = parseInt(numStr);
            if (isNaN(num)) return numStr;
            const factor = Math.floor(Math.random() * 10) + 1;
            const mult = num * factor;
            return `(0x${mult.toString(16)} / 0x${factor.toString(16)})`;
        };

        function obfuscate() {
            let code = document.getElementById('inputCode').value;
            if (!code.trim()) return;

            // 1. Eliminar comentarios
            code = code.replace(/--.*?$/gm, '').replace(/--\[\[[\s\S]*?\]\]/g, '');

            // 2. Proteger Strings (Hexificación)
            // Esto busca textos entre comillas dobles o simples y los transforma
            code = code.replace(/(["'])(.*?)\1/g, function(match, quote, text) {
                return '"' + stringToHex(text) + '"';
            });

            // 3. Mutación de Números (Convierte 100 en operaciones hexadecimales)
            code = code.replace(/\b\d+\b/g, function(match) {
                return numberToMath(match);
            });

            // 4. Inyección de Código Basura Multicapa
            let junkBlock = "";
            for(let i=0; i<5; i++) {
                junkBlock += `local ${generateJunkVar()} = ${numberToMath(Math.floor(Math.random() * 100))};\n`;
                junkBlock += `if ${generateJunkVar()} == ${generateJunkVar()} then ${generateJunkVar()} = nil end;\n`;
            }

            // 5. Minificación y Empaquetado
            code = code.replace(/\s+/g, ' '); // Remover saltos de linea
            
            let finalCode = `
-- Protegido por Ikgonavi Obfuscator
local ${generateJunkVar()} = function()
    ${junkBlock}
    ${code}
end;
${generateJunkVar()}();
            `.trim();

            document.getElementById('outputCode').value = finalCode;
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            output.select();
            document.execCommand('copy');
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }
    </script>
</body>
</html>
