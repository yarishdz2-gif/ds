<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QYREX ULTRA LUAU PROTECTOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Consolas',monospace;min-height:100vh;background:#050505;color:#00ff41;display:flex;align-items:center;justify-content:center;padding:1rem;background-image:linear-gradient(0deg,transparent 24%,rgba(0,255,65,.03) 25%,rgba(0,255,65,.03) 26%,transparent 27%,transparent 74%,rgba(0,255,65,.03) 75%,rgba(0,255,65,.03) 76%,transparent 77%,transparent),linear-gradient(90deg,transparent 24%,rgba(0,255,65,.03) 25%,rgba(0,255,65,.03) 26%,transparent 27%,transparent 74%,rgba(0,255,65,.03) 75%,rgba(0,255,65,.03) 76%,transparent 77%,transparent);background-size:50px 50px}
.container{width:100%;max-width:1100px;border:2px solid #00ff41;box-shadow:0 0 50px #00ff41,inset 0 0 25px rgba(0,255,65,.25);padding:32px;border-radius:14px;background:#0a0a0a;position:relative;overflow:hidden}
.container::before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:#00ff41;box-shadow:0 0 20px #00ff41}
h1{font-size:2.1rem;text-align:center;margin-bottom:22px;text-shadow:0 0 18px #00ff41;letter-spacing:3px}
label{display:block;margin-bottom:8px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1.5px;font-size:.9rem}
textarea{width:100%;height:230px;background:#0f0f0f;border:1px solid #333;color:#00ff41;padding:16px;font-size:.95rem;resize:vertical;margin-bottom:18px;border-radius:6px;transition:all .25s}
textarea:focus{outline:none;border-color:#00ff41;box-shadow:0 0 14px rgba(0,255,65,.35)}
button{width:100%;background:linear-gradient(180deg,#00ff41 0%,#00cc33 100%);color:#000;border:none;padding:16px;font-size:1.25rem;font-weight:800;cursor:pointer;text-transform:uppercase;border-radius:6px;transition:transform .1s,box-shadow .3s;letter-spacing:1px}
button:hover{background:#fff;box-shadow:0 0 30px #00ff41;transform:scale(1.015)}
button:active{transform:scale(.98)}
.stats{display:flex;justify-content:space-between;margin-top:12px;font-size:.8rem;color:#00cc33;opacity:.8}
</style>
</head>
<body>
<div class="container">
<h1>QYREX ULTRA PROTECTOR</h1>
<label>ENTRADA LUAU:</label>
<textarea id="in" placeholder="// Pega tu script Luau aquí..."></textarea>
<button onclick="protect()">PROTEGER AL MÁXIMO</button>
<label>SALIDA PROTEGIDA (1 LÍNEA):</label>
<textarea id="out" readonly placeholder="// Resultado aquí..."></textarea>
<div class="stats" id="stats"></div>
</div>
<script>
function protect(){
const src=document.getElementById("in").value;
if(!src.trim()){alert("Pega un script primero");return}

// ============== ULTRA STRONG MULTI-LAYER OBFUSCATOR ==============
const seed=(Date.now()^Math.floor(Math.random()*0xFFFFFFFF)^performance.now()*1000|0)>>>0;
const charset="ABCDEFGHIJKLMNOPQRSTUVWXYXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,-./:;<=>?@[]^_`{|}~";
const clen=charset.length;

// Layer 1: Strong PRNG (xorshift32 + mix)
function xorshift(s){s^=s<<13;s^=s>>>17;s^=s<<5;return s>>>0}
let state=seed;
function nextByte(){state=xorshift(state);return state&0xFF}

// Layer 2: Multi-key XOR + rotation + position dependent
let encoded=[];
let checksum=0x5A;
for(let i=0;i<src.length;i++){
    let c=src.charCodeAt(i)&0xFF;
    let k1=nextByte();
    let k2=((seed+(i*0x9E3779B9))>>>0)&0xFF;
    let k3=((i*i*31)^(i>>3))&0xFF;
    let rotated=((c<<((i%7)+1))| (c>>>(8-((i%7)+1))))&0xFF;
    let x=rotated^k1^k2^k3;
    checksum=(checksum+x+(i%23)+k1)%256;
    // Encode as 2 chars from charset (base ~90)
    encoded.push(charset[x%clen],charset[Math.floor(x/clen)%clen]);
}

// Layer 3: Chunk + shuffle + noise
const chunkSize=48+Math.floor(Math.random()*24);
let chunks=[];
for(let i=0;i<encoded.length;i+=chunkSize){
    chunks.push(encoded.slice(i,i+chunkSize).join(""));
}
// Shuffle chunks with seeded order
let order=[];
for(let i=0;i<chunks.length;i++)order.push(i);
for(let i=order.length-1;i>0;i--){
    state=xorshift(state);
    let j=state%(i+1);
    [order[i],order[j]]=[order[j],order[i]];
}
let shuffled=[];
let orderTable=[];
for(let i=0;i<order.length;i++){
    shuffled.push('"'+chunks[order[i]]+'"');
    orderTable.push(order[i]);
}

// Layer 4: Generate polymorphic decoder (single line, ultra dense)
const _s=charset;
const _d=shuffled.join("..");
const _o="{"+orderTable.join(",")+"}";
const _k=seed;
const _c=checksum;
const _n=clen;
const _cs=chunkSize;

// The entire payload is ONE single line after the comment
const payload=`-- Protect by Qyrex
local a,b,c,d,e,f,g,h,i,j,k,l,m,n,o,p,q,r,s,t,u,v,w,x,y,z=_G,string,bit32,table,math,tostring,tonumber,pcall,loadstring or load,getfenv or function()return _G end,getgenv and getgenv()or _G,game,Instance,typeof,type,next,pairs,ipairs,select,unpack or table.unpack,rawget,rawset,setmetatable,getmetatable,coroutine,debug;local A="${_s}"local B={${_d}}local C={${_o}}local D=${_k}local E=${_c}local F=${_n}local G=${_cs}local H,I,J,K={},{},0,D;local function L(M)K=bit32.bxor(K,bit32.lshift(K,13));K=bit32.bxor(K,bit32.rshift(K,17));K=bit32.bxor(K,bit32.lshift(K,5));return bit32.band(K,255)end;for N=1,#C do I[C[N]+1]=B[N]end;local O=b.concat(I);for N=1,#O,2 do local P=b.find(A,b.sub(O,N,N),1,true)-1;local Q=b.find(A,b.sub(O,N+1,N+1),1,true)-1;local R=P+Q*F;J=(J+R+(#H%23)+L())%256;local S=bit32.bxor(R,L(),bit32.band(D+(#H*0x9E3779B9),255),bit32.band(bit32.bxor(#H*#H*31,bit32.rshift(#H,3)),255));local T=bit32.band(bit32.rshift(S,(#H%7)+1)|bit32.lshift(S,8-((#H%7)+1)),255);H[#H+1]=T end;if J~=E then return end;local U=b.char(b.byte(H,1,#H));local V=h(U);if V then pcall(V)end`;

document.getElementById("out").value=payload;
document.getElementById("stats").innerHTML=`<span>Seed: ${seed}</span><span>Original: ${src.length} chars</span><span>Protegido: ${payload.length} chars</span><span>Capas: 4 + Shuffle + Polymorphic</span>`;
}
</script>
</body>
</html>
