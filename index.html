<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrex Obfuscator | V1.1.1 Single-Line Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;800&display=swap');
        
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --accent: #3b82f6;
            --glow: rgba(59, 130, 246, 0.4);
            --text: #f4f4f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 2.5rem 1rem; 
            min-height: 100vh; 
        }
        
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; text-shadow: 0 0 20px var(--glow); }
        .header span { color: var(--accent); }
        .header p { color: #a1a1aa; font-size: 0.9rem; margin-top: 5px; }

        .container { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 1200px; height: 75vh; }
        
        .editor { background: var(--panel); border: 1px solid #27272a; border-radius: 12px; display: flex; flex-direction: column; flex: 1; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .editor-top { background: #27272a; padding: 0.75rem 1.5rem; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: #a1a1aa; display: flex; justify-content: space-between; align-items: center; }
        
        textarea { flex: 1; background: transparent; border: none; color: #10b981; padding: 1.25rem; font-family: 'Fira Code', monospace; font-size: 13px; resize: none; outline: none; line-height: 1.6; word-break: break-all; }
        #output { color: #f87171; }
        
        .controls { display: flex; gap: 1rem; justify-content: center; }
        button { background: var(--accent); color: white; border: none; padding: 0.9rem 2.5rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px var(--glow); }
        button:hover { transform: translateY(-2px); background: #2563eb; }
        
        .copy-btn { cursor: pointer; color: var(--accent); font-weight: bold; font-size: 0.8rem; background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 4px; transition: 0.2s; }
        .copy-btn:hover { background: rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body>

    </div>
