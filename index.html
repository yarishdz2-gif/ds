<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrex Obfuscator | Luau Protection</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --primary: #00ff88;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p { color: var(--text-muted); }
        
        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            height: 400px;
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }
        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00cc6a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Qyrex Obfuscator</h1>
        <p>Motor de ofuscación polimórfica para Luau</p>
    </header>

    <div class="container">
        <div class="editor-section">
            <label for="inputCode">Código Luau Original:</label>
            <textarea id="inputCode" placeholder='print("Iniciando sistema...")'></textarea>
        </div>

        <div class="controls">
            <button onclick="ofuscar()">Ofuscar -></button>
        </div>

        <div class="editor-section">
            <label for="outputCode">Código Ofuscado:</label>
            <textarea id="outputCode" readonly placeholder="El resultado aparecerá aquí..."></textarea>
        </div>
    </div>

    <script>
        // Generador de nombres polimórficos
        function generarID(longitud) {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            let resultado = '';
            for (let i = 0; i < longitud; i++) {
                resultado += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return resultado;
        }

        // Generador de código basura (Anti-Tamper falso)
        function generarBasura() {
            const vars = ['A', 'B', 'C', 'X', 'Y', 'Z'];
            const varName = vars[Math.floor(Math.random() * vars.length)] + Math.floor(Math.random() * 999);
            return `local ${varName} = ${Math.floor(Math.random() * 999999)}; if ${varName} == 0 then return end; `;
        }

        function ofuscar() {
            const input = document.getElementById('inputCode').value;
            if (!input.trim()) return alert("Ingresa código para ofuscar.");

            // Variables mutadas por sesión
            const vClave = generarID(6);
            const vMemoria = generarID(9);
            const vDecodificador = generarID(12);
            const vIndice = generarID(5);

            // Generar clave XOR única (1-255)
            const xorKey = Math.floor(Math.random() * 254) + 1;
            
            // Cifrar el payload
            let payloadCifrado = [];
            for (let i = 0; i < input.length; i++) {
                payloadCifrado.push(input.charCodeAt(i) ^ xorKey);
            }

            // Construir el stub (cargador de la VM)
            let stub = `
                ${generarBasura()}
                local ${vClave} = ${xorKey};
                local ${vMemoria} = {${payloadCifrado.join(',')}};
                ${generarBasura()}
                local ${vDecodificador} = "";
                if type(bit32) ~= "table" or type(bit32.bxor) ~= "function" then while true do end end;
                for ${vIndice} = 1, #${vMemoria} do 
                    ${vDecodificador} = ${vDecodificador} .. string.char(bit32.bxor(${vMemoria}[${vIndice}], ${vClave}));
                end;
                ${generarBasura()}
                local s, r = pcall(function() return loadstring(${vDecodificador})() end);
                if not s then return nil end;
            `;

            // Minificar
            const minified = stub.replace(/\n/g, ' ').replace(/\s+/g, ' ');
            document.getElementById('outputCode').value = minified;
        }
    </script>
</body>
</html>
