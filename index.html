<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrex VM Obfuscator | God Tier</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;900&display=swap');
        
        :root {
            --bg: #030303;
            --panel: #0d0d0f;
            --border: #27272a;
            --accent: #ef4444; /* Rojo agresivo */
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-dim: #71717a;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; }
        .brand { font-size: 2rem; font-weight: 900; letter-spacing: -1px; color: white; margin-bottom: 3rem; text-shadow: 0 0 20px var(--accent-glow); }
        .brand span { color: var(--accent); }
        .menu-item { padding: 1rem; color: var(--text-dim); font-weight: 600; font-size: 0.95rem; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 0.5rem; display: flex; justify-content: space-between;}
        .menu-item.active { background: rgba(239, 68, 68, 0.1); color: var(--accent); border: 1px solid rgba(239, 68, 68, 0.3); }

        .main { flex: 1; display: flex; flex-direction: column; padding: 2rem; gap: 1.5rem; }
        .workspace { display: flex; gap: 1.5rem; height: 55vh; }
        
        .editor-container { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; position: relative; }
        .editor-header { background: #111; padding: 0.75rem 1.5rem; font-family: 'Fira Code', monospace; font-size: 0.8rem; color: var(--text-dim); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        
        textarea { flex: 1; background: transparent; border: none; color: #e2e8f0; padding: 1.5rem; font-family: 'Fira Code', monospace; font-size: 13px; resize: none; outline: none; line-height: 1.6; }
        #output { color: #f87171; }
        
        .action-bar { display: flex; gap: 1rem; align-items: stretch; height: 120px; }
        button { background: var(--accent); color: white; border: none; padding: 0 3rem; font-size: 1.1rem; font-weight: 900; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px var(--accent-glow); text-transform: uppercase; letter-spacing: 1px;}
        button:hover { transform: scale(1.02); background: #dc2626; }
        
        .console { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: 'Fira Code', monospace; font-size: 12px; color: var(--text-dim); overflow-y: auto; }
        .log-time { color: var(--accent); margin-right: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">QYREX <span>VM</span></div>
        <div class="menu-item active"><span>Compiler</span> <span style="font-size: 10px; background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px;">GOD MODE</span></div>
        <div class="menu-item">Control Flow</div>
        <div class="menu-item">String Encryption</div>
        <div style="margin-top: auto; font-size: 0.75rem; color: var(--text-dim);">
            Architecture: Custom VM / AST<br>
            Payload Size: Bloated (~500KB)<br>
            Executor Safe: TRUE
        </div>
    </div>

    <div class="main">
        <div class="workspace">
            <div class="editor-container">
                <div class="editor-header">source.lua</div>
                <textarea id="input" spellcheck="false" placeholder="-- Escribe aquí tu script..."></textarea>
            </div>
            
            <div class="editor-container">
                <div class="editor-header">
                    qyrex_build.lua 
                    <span style="cursor:pointer; color: var(--accent);" onclick="copyCode()">[ COPY COMPILATION ]</span>
                </div>
                <textarea id="output" readonly spellcheck="false" placeholder="El bytecode ofuscado aparecerá aquí..."></textarea>
            </div>
        </div>

        <div class="action-bar">
            <button id="btnObf" onclick="compileVM()">COMPILE VM</button>
            <div class="console" id="console">
                <div><span class="log-time">>></span> Awaiting Lua source code...</div>
            </div>
        </div>
    </div>

    <script>
        const log = (msg) => {
            const cons = document.getElementById('console');
            cons.innerHTML += `<div><span class="log-time">[SYS]</span> <span style="color: #fff">${msg}</span></div>`;
            cons.scrollTop = cons.scrollHeight;
        };

        // Genera el diccionario falso "RA" solicitado por el usuario
        function generateDictionary() {
            let entries = [];
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            for(let i=0; i<300; i++) {
                let k = chars[Math.floor(Math.random() * chars.length)];
                let v = Math.random().toString(36).substring(2, 8);
                entries.push(`["${k}${Math.floor(Math.random()*10)}"]="${v}"`);
            }
            // Inyectamos las exactas que pediste para que la estructura sea idéntica a Luraph
            entries.push(`["|"]="Y/6&[",[" "]="?vZ*F",y="+'fxG",["#"]="9G)Iq",["!"]="2G+fq",["{"]="+JX\`v",["~"]="olc-L",["}"]="KN4bL",["\\""]="s98e2",z="6^?6v"`);
            return entries.join(",");
        }

        // Genera opcodes basura para engordar el script
        function generateOpcodes() {
            let out = "";
            for(let i=100; i<2000; i++) {
                out += `elseif E==${i} then return I+E*2, q, i; `;
            }
            return out;
        }

        async function compileVM() {
            const input = document.getElementById('input').value;
            const outEl = document.getElementById('output');
            
            if(!input.trim()) return log("Error: Empty source.");

            document.getElementById('console').innerHTML = '';
            log("Initializing Qyrex Custom VM...");
            await new Promise(r => setTimeout(r, 400));

            log("Encrypting Payload to Bytecode Array...");
            let shiftKey = Math.floor(Math.random() * 50) + 15;
            let byteArr = [];
            for (let i = 0; i < input.length; i++) {
                byteArr.push(input.charCodeAt(i) + shiftKey);
            }

            await new Promise(r => setTimeout(r, 600));
            log("Injecting AST Dispatchers and Metatables...");

            // AQUÍ ESTÁ LA MAGIA. Esta es la estructura exacta que pediste,
            // pero con un "wrapper" que evita que r[116] (string.byte) devuelva nil y crashee el executor.
            
            let luaCode = `
-- [[ Qyrex VM Architecture ]] --
local _env = getfenv or function() return _ENV end
local _ls = _env()["loadstring"] or _env()["load"]
local _sb = function(s, i) return string.byte(tostring(s), i) or 0 end -- Antikick/AntiError Wrapper
local _core = { [116] = _sb }

return setmetatable({
    QA=function(r,q,i,I,E,d,B)
        if E<=89 then 
            local j=i+1;local G=r[116](B,j);return not not(G>=128)and 43 or 181,q,j,G;
        elseif E<=90 then 
            local E=1+i;local j=r[116](B,E);return not(128>j)and 11 or 45,E,j,I;
        ${generateOpcodes()}
        else 
            local E,B,j,G=r[116](d,3),q-128,128*(i-128),2097152*(I-128);return 60,E%128*16384+(E-E%128)*2097152+(j+(B+G)),4,I;
        end;
    end,
    RA={${generateDictionary()}},
    i=function(r,...)(...)[...]=nil;end,
    aA=function(r,q,i,I,E,d) 
        local status = r.QA(r, 255, 1, 10, E, tostring(d), "mock")
        return status
    end,
    __MEM = {${byteArr.join(',')}},
    __KEY = ${shiftKey}
}, {
    __call = function(self)
        -- Booting Virtual Machine
        self.aA(_core, 0, 0, 0, 50, "init")
        self.QA(_core, 255, 10, 20, 80, "sys", "mem")
        
        -- Decrypting payload inside VM sandbox
        local chunk = {}
        for idx = 1, #self.__MEM do
            chunk[idx] = string.char(self.__MEM[idx] - self.__KEY)
        end
        
        -- Executing
        return _ls(table.concat(chunk))()
    end
})()
            `.trim();

            await new Promise(r => setTimeout(r, 500));
            log("Minifying and Packing (Size: MAX)");
            
            // Eliminar espacios innecesarios fuera de los strings para que se vea más ofuscado
            luaCode = luaCode.replace(/\n\s+/g, '\n');

            outEl.value = luaCode;
            log("SUCCESS: VM Generated. 100% Executor Safe.");
        }

        function copyCode() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            log("Copied to clipboard!");
        }
    </script>
</body>
</html>
