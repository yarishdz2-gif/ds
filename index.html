<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFUSCADOR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .box { width: 100%; max-width: 860px; }
  h1 {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 6px;
    text-align: center;
    background: linear-gradient(90deg, #58a6ff, #a371f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1.5rem;
  }
  textarea {
    width: 100%;
    height: 220px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    color: #e6edf3;
    font-family: Consolas, monospace;
    font-size: 0.85rem;
    padding: 0.9rem;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #58a6ff; }
  button {
    display: block;
    width: 100%;
    margin: 1rem 0;
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff;
    border: none;
    padding: 1rem;
    border-radius: 10px;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  #stats { text-align: center; font-size: 0.8rem; color: #8b949e; font-family: monospace; }
</style>
</head>
<body>
<div class="box">
  <h1>OFUSCADOR</h1>
  <textarea id="in" placeholder="PEGA TU SCRIPT LUAU AQUÍ..."></textarea>
  <button onclick="go()">⚡ OFUSCAR</button>
  <textarea id="out" readonly placeholder="AQUÍ SALE TU CÓDIGO OFUSCADO..."></textarea>
  <div id="stats"></div>
</div>

<script>
const BASE = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+-;<=>?@[]^_{|}~.,:/";

function rng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function shuffle(str, r) {
  const t = str.split("");
  for (let i = t.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [t[i], t[j]] = [t[j], t[i]];
  }
  return t.join("");
}

function obfuscate(src) {
  const r = rng((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
  const alpha = shuffle(BASE, r);
  const B = alpha.length;
  const xkey = Math.floor(r() * 256);

  const bytes = [];
  for (let i = 0; i < src.length; i++) bytes.push(src.charCodeAt(i));

  let check = 0;
  for (const b of bytes) check = (check + b) % 256;

  const enc = v => alpha[v % B] + alpha[Math.floor(v / B) % B];

  let payload = enc(xkey) + enc(check);
  for (const b of bytes) payload += enc(b);

  const chunks = [];
  let i = 0;
  while (i < payload.length) {
    const len = Math.min(60 + Math.floor(r() * 80), payload.length - i);
    chunks.push(payload.slice(i, i + len));
    i += len;
  }
  const T = chunks.map(c => '"' + c + '"').join("..\n");

  const decoder = [
    'local T=' + T,
    'local U="' + alpha + '"',
    'local function D(s)',
    'local c={}',
    'for i=1,#s,2 do',
    'local a=U:find(s:sub(i,i),1,true)-1',
    'local b=U:find(s:sub(i+1,i+1),1,true)-1',
    'c[#c+1]=a+b*#U',
    'end',
    'return c',
    'end',
    'local B=D(T)',
    'local X=B[1]',
    'local K=B[2]',
    'local C=0',
    'for i=3,#B do C=(C+B[i])%256 end',
    "if C~=K then error('Integrity check failed') end",
    "local S=''",
    'for i=3,#B do S=S..string.char(bit32.bxor(B[i],X)) end',
    "if not game or not loadstring then error('Roblox only') end",
    'loadstring(S)()'
  ];

  return decoder.join("\n");
}

function go() {
  const src = document.getElementById("in").value;
  if (!src.trim()) { alert("Pega primero tu script."); return; }
  const out = obfuscate(src);
  document.getElementById("out").value = out;
  document.getElementById("stats").textContent =
    "Entrada: " + src.length + " bytes → Salida: " + out.length + " bytes";
}
</script>
</body>
</html>
