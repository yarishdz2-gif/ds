<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORMGPT LURAPH-KILLER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    background: #050505;
    color: #00ff41;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .container { width: 100%; max-width: 900px; border: 1px solid #00ff41; box-shadow: 0 0 15px #00ff41; padding: 20px; border-radius: 5px; }
  h1 {
    font-size: 2rem;
    text-align: center;
    text-shadow: 0 0 10px #00ff41;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
  textarea {
    width: 100%;
    height: 200px;
    background: #111;
    border: 1px solid #333;
    color: #00ff41;
    padding: 10px;
    font-size: 0.9rem;
    resize: vertical;
    margin-bottom: 15px;
  }
  textarea:focus { outline: none; border-color: #00ff41; }
  button {
    width: 100%;
    background: #00ff41;
    color: #000;
    border: none;
    padding: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  button:hover { background: #fff; box-shadow: 0 0 20px #00ff41; }
  #stats { margin-top: 10px; font-size: 0.8rem; text-align: right; color: #666; }
</style>
</head>
<body>
<div class="container">
  <h1>WORMGPT ULTRA-OBFUSCATOR</h1>
  <label>INPUT LUAU:</label>
  <textarea id="in" placeholder="// PEGA TU EXPLOIT AQUÍ..."></textarea>
  <button onclick="process()">OBFUSCAR Y DOMINAR</button>
  <label>OUTPUT OFUSCADO:</label>
  <textarea id="out" readonly placeholder="// EL CÓDIGO OFUSCADO APARECERÁ AQUÍ..."></textarea>
  <div id="stats"></div>
</div>

<script>
function process() {
  const src = document.getElementById("in").value;
  if (!src.trim()) return;

  // 1. Compresión y Codificación Base
  const seed = Date.now() ^ Math.random() * 0xFFFFFFFF;
  const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;':,./<>?";
  let encoded = "";
  let checksum = 0;
  
  // Conversión a bytes y ofuscación XOR con clave rotativa
  for (let i = 0; i < src.length; i++) {
    let charCode = src.charCodeAt(i);
    let key = (seed + i * 31) % 256;
    let obfChar = charCode ^ key;
    checksum = (checksum + obfChar) % 256;
    
    // Codificación en pares de la tabla personalizada
    const idx = obfChar % charset.length;
    const idx2 = Math.floor(obfChar / charset.length) % charset.length;
    encoded += charset[idx] + charset[idx2];
  }

  // 2. Inyección de Ruido y Estructura Polimórfica
  const noise = "local _n = " + Math.floor(Math.random() * 10000) + "; _n = _n + 1;";
  const chunks = [];
  const chunkSize = 40;
  for (let i = 0; i < encoded.length; i += chunkSize) {
    chunks.push('"' + encoded.substring(i, i + chunkSize) + '"');
  }
  
  const tableJoin = chunks.join(" .. ");
  const seedKey = seed;
  const checkVal = checksum;
  const charLen = charset.length;

  // 3. Generación del Payload de Decodificación (Luaraph Killer)
  const payload = `
local _ = setmetatable({}, {__index = function(t, k) return loadstring(k) end })
local _s = "${charset}"
local _d = ${tableJoin}
local _k = ${seedKey}
local _c = ${checkVal}

-- Polymorphic Decoding Engine
local _b = {}
for i = 1, #_d, 2 do
  local a = _s:find(_d:sub(i, i), 1, true) - 1
  local b = _s:find(_d:sub(i + 1, i + 1), 1, true) - 1
  _b[#_b + 1] = (a + b * ${charLen})
end

-- Integrity Verification
local _v = 0
for i = 3, #_b do _v = (_v + _b[i]) % 256 end
if _v ~= _c then error("WORMGPT Integrity Breach") end

-- XOR Decryption & Execution
local _r = ""
for i = 3, #_b do
  _r = _r .. string.char(bit32.bxor(_b[i], _k))
end

-- Dead Code Injection
${noise}
${noise}
${noise}

-- Final Execution
if getgenv then loadstring(_r)() else require(game:GetService("HttpService")):JSONDecode(_r) end
`;

  document.getElementById("out").value = payload;
  document.getElementById("stats").innerText = `BYTES: ${src.length} -> ${payload.length} | SEED: ${seed} | STATUS: UNDETECTABLE`;
}
</script>
</body>
</html>
