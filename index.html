<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luau Obfuscator Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: radial-gradient(1200px 800px at 20% 10%, #1b2735 0%, #090a0f 55%, #0d0f14 100%);
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    padding: 2rem;
    width: 100%;
    max-width: 960px;
  }
  h1 { font-size: 1.5rem; letter-spacing: 0.5px; }
  h1 span { color: #58a6ff; }
  .sub { color: #8b949e; font-size: 0.85rem; margin-top: 0.3rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.8rem; color: #8b949e; margin: 1rem 0 0.4rem; text-transform: uppercase; letter-spacing: 1px; }
  textarea {
    width: 100%;
    height: 180px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #e6edf3;
    font-family: 'Cascadia Code', Consolas, monospace;
    font-size: 0.85rem;
    padding: 0.9rem;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #58a6ff; }
  .row { display: flex; gap: 0.7rem; margin-top: 1rem; flex-wrap: wrap; }
  button {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff;
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(46,160,67,0.35); }
  button.ghost {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
  }
  button.ghost:hover { background: rgba(255,255,255,0.14); box-shadow: none; }
  #stats { margin-top: 0.8rem; font-size: 0.8rem; color: #8b949e; font-family: monospace; }
  .badge {
    display: inline-block;
    background: rgba(88,166,255,0.15);
    color: #58a6ff;
    border: 1px solid rgba(88,166,255,0.3);
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    font-size: 0.7rem;
    margin-left: 0.5rem;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="glass">
