<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1220;
  --card: #121a2b;
  --border: #1e2a3f;
  --text: #e8edf5;
  --muted: #8b9bb4;
  --gold: #c9a84c;
  --danger: #ef4444;
  --success: #10b981;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wrap { width: 100%; max-width: 440px; padding: 24px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
}
.logo {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, #1a2740, #0b1220);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; font-weight: 700; color: var(--gold);
  margin: 0 auto 22px;
}
h1 { text-align: center; font-size: 1.35rem; font-weight: 600; margin-bottom: 6px; }
.sub { text-align: center; color: var(--muted); font-size: 0.875rem; margin-bottom: 28px; line-height: 1.5; }
.fg { margin-bottom: 16px; }
.fg label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.fg input {
  width: 100%;
  padding: 13px 15px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  transition: border-color 0.2s;
}
.fg input:focus { outline: none; border-color: var(--gold); }
.btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: #0b1220;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 6px;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  margin-top: 10px;
}
.btn-outline:hover { border-color: var(--gold); color: var(--gold); filter: none; transform: none; }
.msg {
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
  line-height: 1.45;
}
.msg.error {
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
}
.msg.ok {
  background: rgba(16,185,129,0.12);
  border: 1px solid rgba(16,185,129,0.3);
  color: #6ee7b7;
}
.msg.show { display: block; }
.panel { display: none; }
.panel.active { display: block; }
.link {
  display: block;
  text-align: center;
  margin-top: 18px;
  color: var(--muted);
  font-size: 0.85rem;
  cursor: pointer;
  background: none;
  border: none;
  width: 100%;
  font-family: inherit;
}
.link:hover { color: var(--gold); }
.back {
  display: block;
  text-align: center;
  margin-top: 16px;
  color: var(--muted);
  font-size: 0.82rem;
  text-decoration: none;
}
.back:hover { color: var(--gold); }
.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 20px 0;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">A</div>

    <!-- REGISTER (solo primera vez) -->
    <div class="panel" id="panel-register">
      <h1>Registro de Administrador</h1>
      <p class="sub">Crea la única cuenta de administrador.<br>Solo se permite un registro.</p>
      <div class="msg error" id="reg-error"></div>
      <div class="msg ok" id="reg-ok"></div>
      <form onsubmit="doRegister(event)">
        <div class="fg">
          <label>Nombre del administrador</label>
          <input type="text" id="reg-name" placeholder="Ej: Juan Pérez" required autocomplete="username">
        </div>
        <div class="fg">
          <label>Contraseña</label>
          <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
        </div>
        <div class="fg">
          <label>Confirmar contraseña</label>
          <input type="password" id="reg-pass2" placeholder="Repite la contraseña" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn">Crear cuenta de admin</button>
      </form>
    </div>

    <!-- LOGIN -->
    <div class="panel" id="panel-login">
      <h1>Iniciar sesión</h1>
      <p class="sub">Acceso exclusivo del administrador registrado</p>
      <div class="msg error" id="login-error"></div>
      <form onsubmit="doLogin(event)">
        <div class="fg">
          <label>Nombre de administrador</label>
          <input type="text" id="login-name" placeholder="Tu nombre de admin" required autocomplete="username">
        </div>
        <div class="fg">
          <label>Contraseña</label>
          <input type="password" id="login-pass" placeholder="Tu contraseña" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Entrar al panel</button>
      </form>
      <button class="link" onclick="showPanel('recovery')">¿Olvidaste la contraseña? Usar código de respaldo</button>
    </div>

    <!-- RECOVERY con código de respaldo -->
    <div class="panel" id="panel-recovery">
      <h1>Código de respaldo</h1>
      <p class="sub">Ingresa el código de respaldo para restablecer el acceso de administrador.</p>
      <div class="msg error" id="rec-error"></div>
      <div class="msg ok" id="rec-ok"></div>
      <form onsubmit="doRecovery(event)">
        <div class="fg">
          <label>Código de respaldo</label>
          <input type="password" id="rec-code" placeholder="Código de respaldo" required autocomplete="off">
        </div>
        <div class="fg">
          <label>Nuevo nombre de administrador</label>
          <input type="text" id="rec-name" placeholder="Nuevo nombre" required>
        </div>
        <div class="fg">
          <label>Nueva contraseña</label>
          <input type="password" id="rec-pass" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="fg">
          <label>Confirmar nueva contraseña</label>
          <input type="password" id="rec-pass2" placeholder="Repite la contraseña" required minlength="6">
        </div>
        <button type="submit" class="btn">Restablecer acceso</button>
        <button type="button" class="btn btn-outline" onclick="showPanel('login')">Volver al login</button>
      </form>
    </div>

    <hr class="divider">
    <a href="../index.html" class="back">← Volver al sitio web</a>
  </div>
</div>

<script>
const BACKUP_CODE = 'ST/&gauidnslkjj("#)/"!jmssldnajsdbaskdbsDA';
const STORAGE_KEY = 'inmo_admin_account';

function getAccount() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
  catch { return null; }
}

function saveAccount(name, pass) {
  // Simple hash-like storage (not crypto, demo only)
  const encoded = btoa(unescape(encodeURIComponent(pass + '::' + name)));
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    name: name,
    hash: encoded,
    created: new Date().toISOString()
  }));
}

function checkPass(name, pass) {
  const acc = getAccount();
  if (!acc) return false;
  if (acc.name !== name) return false;
  const encoded = btoa(unescape(encodeURIComponent(pass + '::' + name)));
  return acc.hash === encoded;
}

function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.querySelectorAll('.msg').forEach(m => { m.classList.remove('show'); m.textContent = ''; });
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type + ' show';
}

// Init: register or login
(function init() {
  if (sessionStorage.getItem('admin_auth') === 'ok') {
    window.location.href = 'dashboard.html';
    return;
  }
  const acc = getAccount();
  showPanel(acc ? 'login' : 'register');
})();

function doRegister(e) {
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;

  if (getAccount()) {
    showMsg('reg-error', 'Ya existe una cuenta de administrador. Usa el login o el código de respaldo.', 'error');
    return;
  }
  if (name.length < 2) {
    showMsg('reg-error', 'El nombre debe tener al menos 2 caracteres.', 'error');
    return;
  }
  if (pass.length < 6) {
    showMsg('reg-error', 'La contraseña debe tener al menos 6 caracteres.', 'error');
    return;
  }
  if (pass !== pass2) {
    showMsg('reg-error', 'Las contraseñas no coinciden.', 'error');
    return;
  }

  saveAccount(name, pass);
  showMsg('reg-ok', 'Cuenta creada correctamente. Redirigiendo...', 'ok');
  sessionStorage.setItem('admin_auth', 'ok');
  sessionStorage.setItem('admin_name', name);
  sessionStorage.setItem('admin_login_time', new Date().toISOString());
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
}

function doLogin(e) {
  e.preventDefault();
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;

  if (!getAccount()) {
    showMsg('login-error', 'No hay cuenta registrada. Recarga la página para registrarte.', 'error');
    return;
  }

  if (checkPass(name, pass)) {
    sessionStorage.setItem('admin_auth', 'ok');
    sessionStorage.setItem('admin_name', name);
    sessionStorage.setItem('admin_login_time', new Date().toISOString());
    window.location.href = 'dashboard.html';
  } else {
    showMsg('login-error', 'Nombre o contraseña incorrectos.', 'error');
    document.getElementById('login-pass').value = '';
  }
}

function doRecovery(e) {
  e.preventDefault();
  const code = document.getElementById('rec-code').value;
  const name = document.getElementById('rec-name').value.trim();
  const pass = document.getElementById('rec-pass').value;
  const pass2 = document.getElementById('rec-pass2').value;

  if (code !== BACKUP_CODE) {
    showMsg('rec-error', 'Código de respaldo incorrecto.', 'error');
    return;
  }
  if (name.length < 2) {
    showMsg('rec-error', 'El nombre debe tener al menos 2 caracteres.', 'error');
    return;
  }
  if (pass.length < 6) {
    showMsg('rec-error', 'La contraseña debe tener al menos 6 caracteres.', 'error');
    return;
  }
  if (pass !== pass2) {
    showMsg('rec-error', 'Las contraseñas no coinciden.', 'error');
    return;
  }

  saveAccount(name, pass);
  showMsg('rec-ok', 'Acceso restablecido. Redirigiendo al login...', 'ok');
  setTimeout(() => {
    showPanel('login');
    document.getElementById('login-name').value = name;
  }, 1000);
}
</script>
</body>
</html>
