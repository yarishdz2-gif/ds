<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qyrex Obfuscator | Professional Suite V1.1.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg: #09090b;
            --panel: #121215;
            --border: #27272a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --glow: rgba(59, 130, 246, 0.3);
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 2rem 1rem; 
            min-height: 100vh; 
        }
        
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; text-shadow: 0 0 25px var(--glow); }
        .header span { color: var(--accent); }
        .header p { color: var(--text-dim); font-size: 0.85rem; margin-top: 6px; }

        .container { display: flex; flex-direction: column; gap: 1.2rem; width: 100%; max-width: 1200px; }
        
        .options-bar { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-dim); cursor: pointer; user-select: none; }
        .checkbox-label input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

        .editors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; height: 50vh; }
        @media(max-width: 900px) { .editors-grid { grid-template-columns: 1fr; height: auto; } }

        .editor { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .editor-top { background: #18181b; padding: 0.75rem 1.25rem; font-family: 'Fira Code', monospace; font-size: 0.8rem; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        textarea { flex: 1; background: transparent; border: none; color: #10b981; padding: 1rem; font-family: 'Fira Code', monospace; font-size: 12.5px; resize: none; outline: none; line-height: 1.5; word-break: break-all; }
        #output { color: #f87171; }
        
        .controls { display: flex; gap: 1rem; justify-content: center; margin: 0.5rem 0; }
        button.action-btn { background: var(--accent); color: white; border: none; padding: 0.85rem 3rem; font-size: 0.95rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 20px var(--glow); }
        button.action-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
        
        .copy-btn { cursor: pointer; color: var(--accent); font-weight: bold; font-size: 0.75rem; background: rgba(59, 130, 246, 0.1); padding: 4px 10px; border-radius: 4px; transition: 0.2s; border: 1px solid rgba(59, 130, 246, 0.2); }
        .copy-btn:hover { background: rgba(59, 130, 246, 0.2); }

        .status-bar { font-size: 0.75rem; color: var(--text-dim); text-align: center; font-family: 'Fira Code', monospace; }
    </style>
</head>
<body>

    <div class="header">
        <h1>QYREX <span>OBFUSCATOR</span></h1>
        <p>Engine V1.1.1 | Advanced Luau Virtualization & Anti-Dump Suite</p>
    </div>

    <div class="container">
        <!-- Opciones de ofuscación -->
        <div class="options-bar">
            <label class="checkbox-label"><input type="checkbox" id="opt-xor" checked> Cifrado XOR Dinámico</label>
            <label class="checkbox-label"><input type="checkbox" id="opt-mangle" checked> Ofuscar Variables (Mangling)</label>
            <label class="checkbox-label"><input type="checkbox" id="opt-antidump" checked> Anti-Dump & Anti-Lunr</label>
        </div>

        <!-- Paneles de Código -->
        <div class="editors-grid">
            <div class="editor">
                <div class="editor-top">INPUT_SCRIPT.LUA</div>
                <textarea id="input" spellcheck="false" placeholder="-- Pega tu script de Luau aquí para ofuscarlo..."></textarea>
            </div>
            <div class="editor">
                <div class="editor-top">
                    OUTPUT_OBFUSCATED.LUA (1 Single Line)
                    <span class="copy-btn" onclick="copyCode()">[ Copiar ]</span>
                </div>
                <textarea id="output" readonly spellcheck="false" wrap="off" placeholder="El código procesado y protegido aparecerá aquí..."></textarea>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn" onclick="generateObfuscation()">OFUSCAR SCRIPT AHORA</button>
        </div>

        <div class="status-bar" id="status">Estado: Listo para procesar.</div>
    </div>

    <script>
        function generateObfuscation() {
            let code = document.getElementById('input').value;
            if(!code.trim()) {
                alert("¡Ingresa un script válido en la caja de entrada!");
                return;
            }

            const useXor = document.getElementById('opt-xor').checked;
            const useMangle = document.getElementById('opt-mangle').checked;
            const useAntiDump = document.getElementById('opt-antidump').checked;

            // 1. Limpieza básica de comentarios
            code = code.replace(/--\[\[[\s\S]*?\]\]/g, '').replace(/--.*/g, '');

            // 2. Mangling de variables locales si está activo
            if(useMangle) {
                const varMatches = code.match(/\blocal\s+([a-zA-Z_][a-zA-Z0-9_]*)/g);
                if(varMatches) {
                    varMatches.forEach((match, idx) => {
                        const varName = match.replace('local', '').trim();
                        if(varName.length > 1 && varName !== 'game' && varName !== 'script') {
                            const fakeName = '_0x' + Math.random().toString(16).substring(2, 8);
                            const regex = new RegExp('\\b' + varName + '\\b', 'g');
                            code = code.replace(regex, fakeName);
                        }
                    });
                }
            }

            // 3. Generación de clave XOR y cifrado de bytes reales
            let key = Math.floor(Math.random() * 200) + 15;
            let processedBytes = [];
            
            for (let i = 0; i < code.length; i++) {
                let charCode = code.charCodeAt(i);
                if(useXor) {
                    charCode = charCode ^ key; // Aplicar XOR real
                }
                processedBytes.push(charCode);
            }

            const bytesString = processedBytes.join(',');

            // 4. Construcción del Runner con Anti-Dump y el VM Qyrex V1.1.1
            let protectionStub = useAntiDump ? `local g=getfenv or function()return _ENV end;local e=g();local c=function(f)if type(f)=="function"then local s,r=pcall(function()return string.dump(f)end);if s then error("lunr: The bot was unable to process the file fully, however it recovered a part of the file:")end;end;end;if e.debug and e.debug.getinfo then local s,r=pcall(function()return e.debug.getinfo(1)end);if not s or r.what~="C"then error("lunr: The bot was unable to process the file fully, however it recovered a part of the file:")end;end;if e.hookfunction or e.hookmetamethod or e.newcclosure or e.Luraph then error("lunr: The bot was unable to process the file fully, however it recovered a part of the file:")end;` : `local c=function()end;`;

            let decoderLogic;
            if(useXor) {
                decoderLogic = `local t={${bytesString}};local b={};for i=1,#t do b[i]=string.char(t[i]~${key})end;return loadstring(table.concat(b))()`;
            } else {
                decoderLogic = `return loadstring(string.char(${bytesString}))()`;
            }

            const finalPayload = `--[[ This file was protected using Qyrex Obfuscator v1.1.1[https://qyrex.hopto.org/] ]] return setmetatable({QA=function(r,q,i,I,E,d,B)if E<=89 then local j=i+1;local G=r[116](B,j);return not not(G>=128)and 43 or 181,q,j,G;elseif E<=90 then local E=1+i;local j=r[116](B,E);return not(128>j)and 11 or 45,E,j,I;else local E,B,j,G=r[116](d,3),q-128,128*(i-128),2097152*(I-128);return 60,E%128*16384+(E-E%128)*2097152+(j+(B+G)),4,I;end;end},{__call=function(VM)${protectionStub}${decoderLogic}end})()`;

            document.getElementById('output').value = finalPayload;
            document.getElementById('status').innerText = `¡Éxito! Script ofuscado correctamente (${code.length} caracteres procesados con cifrado XOR y Mangling).`;
        }

        function copyCode() {
            const outputBox = document.getElementById('output');
            if(!outputBox.value) return;
            outputBox.select();
            document.execCommand('copy');
            document.getElementById('status').innerText = "¡Código copiado al portapapeles con éxito!";
        }
    </script>
</body>
</html>
